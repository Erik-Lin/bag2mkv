name: Linux CLI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ unzip curl

      - name: Download Orbbec K4A Wrapper (Linux)
        run: |
          curl -L --fail --retry 3 \
            -o /tmp/k4a-wrapper.zip \
            https://github.com/orbbec/OrbbecSDK-K4A-Wrapper/releases/download/v2.0.12/OrbbecSDK_K4A_Wrapper_v2.0.12_linux_202605090945.zip
          rm -rf /tmp/k4a-wrapper
          mkdir -p /tmp/k4a-wrapper
          unzip -q /tmp/k4a-wrapper.zip -d /tmp/k4a-wrapper
          K4A_HEADER=$(find /tmp/k4a-wrapper -path '*/include/k4a/k4a.h' -print -quit)
          if [ -z "$K4A_HEADER" ]; then
            echo "k4a.h not found in downloaded K4A wrapper" >&2
            exit 1
          fi
          K4A_ROOT=$(cd "$(dirname "$K4A_HEADER")/../.." && pwd)
          echo "K4A_ROOT=$K4A_ROOT" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DK4A_ROOT="$K4A_ROOT"

      - name: Build
        run: |
          set -o pipefail
          cmake --build build --parallel 2 2>&1 | tee build.log

      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -n -E 'error:|fatal error|undefined reference|FAILED' build.log | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

      - name: Test
        env:
          LD_LIBRARY_PATH: ${{ env.K4A_ROOT }}/lib
        run: |
          ./build/bag2mkv --version
          ./build/bag2mkv --self-test
          ctest --test-dir build --output-on-failure

      - name: Package CLI
        run: |
          set -euxo pipefail
          trap 'echo "::error::Package failed: $BASH_COMMAND"' ERR
          VERSION=$(./build/bag2mkv --version 2>/dev/null | awk '$1 == "bag2mkv" { print $2; exit }')
          if [ -z "$VERSION" ]; then
            echo "could not determine bag2mkv version" >&2
            exit 1
          fi
          NAME=bag2mkv-${VERSION}-linux-x86_64-cli
          mkdir -p "dist/$NAME/bin" "dist/$NAME/libexec" "dist/$NAME/lib" \
                   "dist/$NAME/share/doc/bag2mkv" "dist/$NAME/share/licenses"
          cp build/bag2mkv "dist/$NAME/libexec/bag2mkv"
          copy_runtime() {
            pattern="$1"
            dest="$2"
            required="$3"
            src=$(find "$K4A_ROOT/lib" -maxdepth 1 -name "$pattern" -print -quit)
            if [ -n "$src" ]; then
              cp -L "$src" "dist/$NAME/lib/$dest"
            elif [ "$required" = "yes" ]; then
              echo "missing required runtime: $pattern" >&2
              return 1
            fi
          }
          copy_runtime 'libk4a.so.1*' 'libk4a.so.1.4' yes
          copy_runtime 'libk4arecord.so.1*' 'libk4arecord.so.1.4' yes
          copy_runtime 'libOrbbecSDK.so.2*' 'libOrbbecSDK.so.2' yes
          copy_runtime 'libdepthengine.so.2*' 'libdepthengine.so.2.0' no
          cp "$K4A_ROOT"/lib/OrbbecSDKConfig.xml "dist/$NAME/lib/OrbbecSDKConfig.xml" || true
          cp README.md README.zh-CN.md CHANGELOG.md LICENSE "dist/$NAME/share/doc/bag2mkv/"
          cp third_party/lz4/LICENSE third_party/bzip2/COPYING third_party/sqlite/README.txt \
             "dist/$NAME/share/licenses/"
          cat > "dist/$NAME/bin/bag2mkv" <<'EOF'
          #!/bin/sh
          set -eu
          here=$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)
          root=$(CDPATH= cd -- "$here/.." && pwd)
          export LD_LIBRARY_PATH="$root/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          exec "$root/libexec/bag2mkv" "$@"
          EOF
          chmod +x "dist/$NAME/bin/bag2mkv" "dist/$NAME/libexec/bag2mkv"
          if ! tar -C dist -czf "$NAME.tar.gz" "$NAME" 2>tar.err; then
            echo "::error::tar failed for NAME=$NAME"
            while IFS= read -r line; do
              echo "::error::tar: $line"
            done < tar.err
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: linux-cli
          path: bag2mkv-*-linux-x86_64-cli.tar.gz
